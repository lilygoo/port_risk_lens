name: Feature request or feedback
description: Suggest an improvement or leave a comment about Portfolio Risk Lens.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Feedback type
      options:
        - Feature request
        - Usability improvement
        - Data or calculation question
        - General comment
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What would you like to change?
      description: Describe the desired outcome and why it would help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include an example or screenshot if useful. Do not include private portfolio data.
