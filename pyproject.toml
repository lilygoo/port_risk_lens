[project]
name = "port-risk-lens"
version = "0.1.0"
description = "Long-short portfolio market-data and risk analytics pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "supabase>=2.15,<3",
    "yfinance>=1.7.0",
]

[project.scripts]
port-risk-lens = "port_risk_lens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
